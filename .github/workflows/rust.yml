name: Rust

on:
  push:
    branches: [ master, test_* ]
  pull_request:
    branches: [ master ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  Build:
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Python - Install 3.8
        uses: actions/setup-python@v2
        with:
          python-version: "3.8"
      # Required on every OS, not just Linux: rt/dynamic.rs pins the hostfxr runtime
      # config at 11.0.0-preview.1, and hostfxr will not roll forward from a release
      # request to a pre-release runtime. The plugin-load tests boot that runtime, and
      # define_plugin! now builds the plugins, so the SDK is needed at test time.
      - name: .NET - Install
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"
      - name: Python - Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cffi pytest
      - name: Rust - Install Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.15
        with:
          components: rustfmt, clippy
      - name: Rust - Install Bootstrap Tools
        uses: taiki-e/install-action@v2
        with:
          tool: just, cargo-binstall
      - name: Rust - Install Rust Tools
        run: just binstall-deps --force
      - name: Run CI
        run: just ci --verbose
